<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Phosphene Studio - Model Hub</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background-color: #0b0f19;
      color: #e2e8f0;
      padding: 32px;
      user-select: none;
      -webkit-app-region: drag;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
      -webkit-app-region: no-drag;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 32px;
      border-bottom: 1px solid #1e293b;
      padding-bottom: 20px;
    }
    .logo-title {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .logo-icon {
      width: 48px;
      height: 48px;
      background: linear-gradient(135deg, #6366f1, #a855f7);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 24px;
      color: white;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
    }
    h1 {
      font-size: 24px;
      font-weight: 700;
      color: #f8fafc;
    }
    p.subtitle {
      color: #94a3b8;
      font-size: 14px;
      margin-top: 4px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
      gap: 20px;
      margin-bottom: 32px;
    }
    .card {
      background-color: #131b2e;
      border: 1px solid #1e293b;
      border-radius: 14px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: all 0.2s ease;
    }
    .card:hover {
      border-color: #3b82f6;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
    }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 12px;
    }
    .card-title {
      font-size: 16px;
      font-weight: 600;
      color: #f1f5f9;
    }
    .badge {
      font-size: 11px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 20px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .badge-req {
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.3);
    }
    .badge-opt {
      background: rgba(59, 130, 246, 0.15);
      color: #60a5fa;
      border: 1px solid rgba(59, 130, 246, 0.3);
    }
    .badge-done {
      background: rgba(34, 197, 94, 0.15);
      color: #4ade80;
      border: 1px solid rgba(34, 197, 94, 0.3);
    }
    .card-body {
      font-size: 13px;
      color: #94a3b8;
      line-height: 1.5;
      margin-bottom: 16px;
    }
    .card-meta {
      display: flex;
      gap: 16px;
      font-size: 12px;
      color: #64748b;
      margin-bottom: 16px;
    }
    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      pt: 12px;
      border-top: 1px solid #1e293b;
    }
    .btn {
      background: #3b82f6;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn:hover {
      background: #2563eb;
    }
    .btn:disabled {
      background: #334155;
      color: #64748b;
      cursor: not-allowed;
    }
    .btn-success {
      background: #10b981;
    }
    .btn-success:hover {
      background: #059669;
    }
    .footer-actions {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 16px;
      margin-top: 20px;
    }
    .btn-large {
      padding: 12px 28px;
      font-size: 15px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      box-shadow: 0 4px 14px rgba(99, 102, 241, 0.4);
    }
    .btn-large:hover {
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
    }
    .progress-container {
      margin-top: 20px;
      background: #131b2e;
      border-radius: 12px;
      padding: 16px;
      border: 1px solid #1e293b;
      display: none;
    }
    .progress-bar {
      height: 8px;
      background: #1e293b;
      border-radius: 4px;
      overflow: hidden;
      margin-top: 8px;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #6366f1, #3b82f6);
      transition: width 0.3s ease;
    }
    .log-output {
      font-family: monospace;
      font-size: 11px;
      color: #64748b;
      max-height: 80px;
      overflow-y: auto;
      margin-top: 8px;
      background: #090d16;
      padding: 8px;
      border-radius: 6px;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="logo-title">
        <div class="logo-icon">P</div>
        <div>
          <h1>Phosphene Studio - Model Manager</h1>
          <p class="subtitle">Select and download AI models to run Phosphene Studio locally on your Mac</p>
        </div>
      </div>
    </header>

    <div class="grid" id="modelsGrid">
      <!-- Dynamically populated -->
    </div>

    <div class="progress-container" id="progressContainer">
      <div style="display:flex; justify-content:space-between; font-size:13px;">
        <span id="progressStatus">Downloading selected models...</span>
        <span id="progressPercent">0%</span>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <div class="log-output" id="logOutput">Ready.</div>
    </div>

    <div class="footer-actions">
      <button class="btn btn-large" id="launchBtn" onclick="launchApp()">Start Phosphene Studio</button>
    </div>
  </div>

  <script>
    const { ipcRenderer } = require('electron');

    let modelsList = [];

    ipcRenderer.on('models-status', (event, models) => {
      modelsList = models;
      renderModels();
    });

    ipcRenderer.on('download-log', (event, log) => {
      const logOutput = document.getElementById('logOutput');
      logOutput.innerText = log;
      logOutput.scrollTop = logOutput.scrollHeight;
    });

    ipcRenderer.on('download-progress', (event, data) => {
      document.getElementById('progressContainer').style.display = 'block';
      document.getElementById('progressStatus').innerText = `Downloading ${data.modelName}...`;
      document.getElementById('progressFill').style.width = `${data.percent}%`;
      document.getElementById('progressPercent').innerText = `${data.percent}%`;
    });

    ipcRenderer.on('download-complete', (event, modelId) => {
      document.getElementById('progressStatus').innerText = `Download complete!`;
      document.getElementById('progressFill').style.width = `100%`;
      document.getElementById('progressPercent').innerText = `100%`;
      ipcRenderer.send('get-models-status');
    });

    function renderModels() {
      const grid = document.getElementById('modelsGrid');
      grid.innerHTML = '';

      let hasRequiredDownloaded = true;

      modelsList.forEach(model => {
        const isDone = model.isDownloaded;
        if (model.required && !isDone) {
          hasRequiredDownloaded = false;
        }

        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div>
            <div class="card-header">
              <div class="card-title">${model.name}</div>
              <span class="badge ${isDone ? 'badge-done' : (model.required ? 'badge-req' : 'badge-opt')}">
                ${isDone ? 'Installed' : (model.required ? 'Required' : 'Optional')}
              </span>
            </div>
            <div class="card-body">${model.blurb}</div>
            <div class="card-meta">
              <span>💾 Size: ${model.size_gb} GB</span>
              <span>⚡ Rec: ${model.recommended_ram}</span>
            </div>
          </div>
          <div class="card-footer">
            <span style="font-size: 12px; color: ${isDone ? '#4ade80' : '#94a3b8'};">
              ${isDone ? '✓ Ready on disk' : 'Not downloaded'}
            </span>
            <button class="btn ${isDone ? 'btn-success' : ''}" 
                    onclick="toggleDownload('${model.id}')" 
                    ${isDone ? 'disabled' : ''}>
              ${isDone ? 'Downloaded' : 'Download'}
            </button>
          </div>
        `;
        grid.appendChild(card);
      });

      const launchBtn = document.getElementById('launchBtn');
      if (hasRequiredDownloaded) {
        launchBtn.disabled = false;
        launchBtn.innerText = 'Start Phosphene Studio';
      } else {
        launchBtn.disabled = true;
        launchBtn.innerText = 'Download Required Models First';
      }
    }

    function toggleDownload(modelId) {
      document.getElementById('progressContainer').style.display = 'block';
      document.getElementById('progressStatus').innerText = `Initializing download...`;
      ipcRenderer.send('start-download', modelId);
    }

    function launchApp() {
      ipcRenderer.send('start-main-app');
    }

    // Request initial status
    ipcRenderer.send('get-models-status');
  </script>
</body>
</html>
